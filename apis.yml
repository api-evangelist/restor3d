apis:
- name: restor3d Website Content API (WordPress REST + MCP)
  description: >-
    The machine-readable surface served by restor3d's corporate website. It is a stock WordPress
    REST API (namespaces wp/v2, wp-abilities/v1, mcp, plus SEO/caching plugin namespaces) covering
    site content types - pages, posts, events, resources, procedures, product families and product
    categories - together with a Model Context Protocol server mounted at /wp-json/mcp. This is
    the content surface of a marketing site, NOT a product, clinical, implant-design or ordering
    API; restor3d publishes no such API. Read routes are anonymous; every write route and both MCP
    servers require authentication.
  humanURL: https://www.restor3d.com/
  baseURL: https://www.restor3d.com/wp-json
