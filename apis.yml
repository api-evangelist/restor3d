aid: restor3d
name: restor3d
description: >-
  restor3d is a Durham, North Carolina medical device manufacturer, founded in 2017 as a Duke
  University spinout, that designs and 3D-prints personalized musculoskeletal implants and the
  single-use instrumentation that goes with them. The company unites additive manufacturing of
  osseointegrative titanium and cobalt-chrome lattices, biomechanics research, and AI-driven
  planning and design-automation software to produce patient-matched total ankle, total knee,
  total hip and shoulder reconstruction systems, plus foot-and-ankle and spine fixation devices.
  Manufacturing and design are vertically integrated in-house, and the company sponsors device
  performance research at Duke. restor3d is a regulated device maker rather than a software
  vendor - it publishes no developer portal, no product or clinical API, no SDKs and no public
  OpenAPI. The only machine-readable surface it serves is its own corporate WordPress site,
  which exposes the standard WordPress REST API and an OAuth-protected Model Context Protocol
  endpoint over site content.
