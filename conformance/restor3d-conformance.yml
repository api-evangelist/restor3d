method: probed
source: >-
  The two OAuth metadata documents restor3d serves at /.well-known/ (both HTTP 200, 2026-08-26)
  and the WordPress REST index at https://www.restor3d.com/wp-json/ (HTTP 200). No compliance,
  certification or standards claims appear anywhere on www.restor3d.com; the site has no trust
  centre, no security page and no developer documentation.
api: restor3d Website Content API (WordPress REST + MCP)
conformance:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server publishes issuer, authorization_endpoint,
    token_endpoint, revocation_endpoint, response_types_supported [code] and grant_types_supported
    [authorization_code, refresh_token].
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    A conformant metadata document is served at the RFC 8414 well-known path
    https://www.restor3d.com/.well-known/oauth-authorization-server (HTTP 200, application/json).
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
  conforms: true
  evidence: >-
    https://www.restor3d.com/.well-known/oauth-protected-resource (HTTP 200) returns
    resource, authorization_servers[], bearer_methods_supported[header] and scopes_supported[mcp].
- id: pkce
  name: PKCE (RFC 7636)
  conforms: true
  evidence: 'code_challenge_methods_supported: [S256] in the authorization server metadata.'
- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage (RFC 6750)
  conforms: true
