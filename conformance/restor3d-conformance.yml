domain_standards:
  assessed: true
  declared: none
  note: >-
    restor3d's market is orthopaedic medical devices, where the relevant interoperability
    standards would be HL7 v2 / FHIR (clinical exchange), DICOM (the CT/MRI imaging that
    patient-matched implant design consumes), GS1/FDA UDI (device identification) and X12 837/278
    for claims and prior authorisation. NONE of these is declared anywhere in a restor3d contract
    or on its website, because restor3d publishes no clinical, imaging or ordering API at all -
    only a WordPress content surface, which has no domain standard to conform to. Recorded as
    assessed-and-absent rather than left blank; nothing is invented to fill the slot.
compliance_certifications:
  found: []
  note: >-
    No SOC 2, ISO 27001, ISO 13485, HIPAA, FedRAMP or PCI claim is published on www.restor3d.com,
